<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Frame 1</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #f2f2f2;
    }

    body {
      display: grid;
      place-items: start center;
      font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    .frame {
      position: relative;
      width: 375px;
      height: 812px;
      overflow: hidden;
      background: #fff;
    }

    .cover {
      display: block;
      width: 375px;
      height: 812px;
      object-fit: fill;
      user-select: none;
      -webkit-user-drag: none;
    }

    .wink-eye {
      position: absolute;
      left: 109px;
      top: 337px;
      width: 14px;
      height: 24px;
      border-radius: 8px;
      background: #f8497f;
      opacity: 0;
      pointer-events: none;
      z-index: 4;
      animation: eye-wink 3.2s ease-in-out infinite;
    }

    .wink-eye::after {
      content: "";
      position: absolute;
      left: 2px;
      top: 7px;
      width: 9px;
      height: 9px;
      border-right: 3px solid #2b1020;
      border-bottom: 3px solid #2b1020;
      border-radius: 1px;
      transform: rotate(-45deg);
    }

    @keyframes eye-wink {
      0%, 42%, 56%, 100% {
        opacity: 0;
      }

      46%, 52% {
        opacity: 1;
      }
    }

    .label-cleanup {
      position: absolute;
      left: 55%;
      top: 23.8%;
      width: 26.5%;
      height: 9.2%;
      background: linear-gradient(110deg, #feb9e7 0%, #febbe8 52%, #febeea 100%);
      transform: rotate(-20deg);
      pointer-events: none;
      -webkit-mask-image: radial-gradient(ellipse at center, #000 84%, transparent 100%);
      mask-image: radial-gradient(ellipse at center, #000 84%, transparent 100%);
    }

    .exact-glyph {
      position: absolute;
      pointer-events: none;
      animation: exact-glyph-hop 1.92s ease-in-out infinite;
      animation-delay: 0s;
      will-change: transform;
    }

    .exact-glyph img {
      display: block;
      width: 100%;
      height: 100%;
      user-select: none;
      -webkit-user-drag: none;
    }

    @keyframes exact-glyph-hop {
      0%, 35%, 100% {
        transform: translateY(0);
      }

      15% {
        transform: translateY(-6px);
      }

      25% {
        transform: translateY(1px);
      }

    }

    @media (prefers-reduced-motion: reduce) {
      .exact-glyph {
        animation: none;
      }

      .wink-eye {
        animation: none;
        opacity: 0;
      }
    }

    .question-link {
      position: absolute;
      left: 8.5%;
      top: 76.72%;
      width: 83%;
      height: 7.52%;
      border-radius: 999px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      z-index: 10;
    }

    .question-link:focus-visible {
      outline: 3px solid #1683ff;
      outline-offset: 3px;
    }

    @media (max-width: 374px) {
      .frame {
        width: 100vw;
        height: calc(100vw * 812 / 375);
      }

      .cover {
        width: 100%;
        height: 100%;
      }
    }
  </style>
  <script src="js/ambient-music.js" defer></script>
</head>
<body>
  <main class="frame" aria-label="Frame 1，375×812">
    <img
      class="cover"
      src="assets/svg/cover.svg"
      width="375"
      height="812"
      alt="恋爱饭搭子人格测试封面"
    >
    <span class="wink-eye" aria-hidden="true"></span>
    <div class="label-cleanup" aria-hidden="true"></div>
    <span class="exact-glyph" style="left:215px;top:220px;width:26px;height:27px;--i:0" aria-hidden="true"><img src="assets/images/label-glyph-1.png" alt=""></span>
    <span class="exact-glyph" style="left:235px;top:212px;width:26px;height:28px;--i:1" aria-hidden="true"><img src="assets/images/label-glyph-2.png" alt=""></span>
    <span class="exact-glyph" style="left:255px;top:204px;width:27px;height:27px;--i:2" aria-hidden="true"><img src="assets/images/label-glyph-3.png" alt=""></span>
    <span class="exact-glyph" style="left:275px;top:196px;width:24px;height:28px;--i:3" aria-hidden="true"><img src="assets/images/label-glyph-4.png" alt=""></span>
    <span class="exact-glyph" style="left:235px;top:235px;width:27px;height:27px;--i:4" aria-hidden="true"><img src="assets/images/label-glyph-5.png" alt=""></span>
    <span class="exact-glyph" style="left:256px;top:228px;width:26px;height:27px;--i:5" aria-hidden="true"><img src="assets/images/label-glyph-6.png" alt=""></span>
    <span class="exact-glyph" style="left:275px;top:221px;width:24px;height:23px;--i:6" aria-hidden="true"><img src="assets/images/label-glyph-7.png" alt=""></span>
    <a class="question-link" href="quiz1.html?new=1" aria-label="立即查看，进入问答第一页"></a>
  </main>
</body>
</html>
