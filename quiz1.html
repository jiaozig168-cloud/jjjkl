<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>问答1</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #f2f2f2;
    }

    body {
      display: grid;
      place-items: start center;
      perspective: 1200px;
      overflow: hidden;
    }

    .frame {
      position: relative;
      width: 375px;
      height: 812px;
      overflow: hidden;
      background: #fff;
      transform-origin: center;
    }

    .frame.is-dissolving {
      animation: page-turn 1s cubic-bezier(0.55, 0.02, 0.34, 1) forwards;
      pointer-events: none;
    }

    @keyframes page-turn {
      0% {
        opacity: 1;
        filter: blur(0);
        transform: translateX(0) rotateY(0deg) scale(1);
      }

      45% {
        opacity: 0.92;
        filter: blur(0.6px) brightness(1.08);
        transform: translateX(-7%) rotateY(-18deg) scale(0.985);
      }

      100% {
        opacity: 0;
        filter: blur(5px) brightness(0.8);
        transform: translateX(-105%) rotateY(-42deg) scale(0.94);
      }
    }

    .cover {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
      user-select: none;
      -webkit-user-drag: none;
    }

    .cake-highlight {
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.08);
      clip-path: path("M 150 494 C 213.513 494 265 527.579 265 569 L 265 644 C 265 685.421 213.513 719 150 719 C 142.828 719 135.809 718.569 129 717.75 L 129 665 L 58 688 L 58 689.006 C 43.5585 676.47 35 660.887 35 644 L 35 569 C 35 527.579 86.4873 494 150 494 Z");
      -webkit-backdrop-filter: brightness(1.22) saturate(1.45);
      backdrop-filter: brightness(1.22) saturate(1.45);
      pointer-events: none;
    }

    .foreground-corner {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      clip-path: path("M 77.5 675 C 52.1667 682 1.2 696.2 0 697 L 0 814 L 57 814 L 57 735 C 56.2 726.2 59.3333 718 61 715 Z");
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    .top-home-link {
      position: absolute;
      left: 2.8%;
      top: 5.5%;
      width: 11%;
      height: 6.5%;
      border-radius: 50%;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      z-index: 16;
    }

    .top-home-link:focus-visible {
      outline: 3px solid #1683ff;
      outline-offset: 2px;
    }

    .back-link {
      position: absolute;
      left: 3.5%;
      top: 89.7%;
      width: 16%;
      height: 8%;
      border-radius: 50%;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      z-index: 10;
    }

    .back-link:focus-visible {
      outline: 3px solid #1683ff;
      outline-offset: 2px;
    }

    .next-link {
      position: absolute;
      left: 80.5%;
      top: 89.7%;
      width: 16%;
      height: 8%;
      border-radius: 50%;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      z-index: 10;
    }

    .next-link:focus-visible {
      outline: 3px solid #1683ff;
      outline-offset: 2px;
    }

    .answer-option {
      position: absolute;
      display: block;
      appearance: none;
      -webkit-appearance: none;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      cursor: pointer;
      z-index: 12;
      -webkit-tap-highlight-color: transparent;
    }

    .answer-option.is-selected {
      background: #ffd84d;
      mix-blend-mode: multiply;
    }

    .answer-option:focus-visible {
      outline: 3px solid #1683ff;
      outline-offset: 2px;
    }

    .answer-a { left: 204px; top: 257px; width: 120px; height: 32px; }
    .answer-b { left: 116px; top: 338px; width: 184px; height: 32px; }
    .answer-c { left: 45px; top: 420px; width: 206px; height: 32px; }
    .answer-d { left: 181px; top: 503px; width: 168px; height: 32px; }

    @media (max-width: 374px) {
      .frame {
        width: 100vw;
        height: calc(100vw * 812 / 375);
      }
    }
  </style>
  <script src="js/ambient-music.js" defer></script>
</head>
<body>
  <main class="frame" aria-label="问答1，375×812">
    <img
      class="cover"
      src="assets/svg/quiz1.svg"
      width="375"
      height="812"
      alt="恋爱饭搭子人格测试问答第一页"
    >
    <div class="cake-highlight" aria-hidden="true"></div>
    <img
      class="foreground-corner"
      src="assets/svg/quiz1.svg"
      width="375"
      height="812"
      alt=""
      aria-hidden="true"
    >
    <a class="top-home-link" href="index.html" aria-label="返回首页"></a>
    <a class="back-link" href="index.html" aria-label="返回首页"></a>
    <a class="next-link" href="quiz2.html" aria-label="进入问答第二页"></a>
    <button class="answer-option answer-a" data-choice="A" type="button" aria-label="选择答案 A"></button>
    <button class="answer-option answer-b" data-choice="B" type="button" aria-label="选择答案 B"></button>
    <button class="answer-option answer-c" data-choice="C" type="button" aria-label="选择答案 C"></button>
    <button class="answer-option answer-d" data-choice="D" type="button" aria-label="选择答案 D"></button>
  </main>
  <script src="js/quiz-results.js"></script>
  <script>
    const answerOptions = document.querySelectorAll('.answer-option');
    const pageFrame = document.querySelector('.frame');
    let isNavigating = false;

    answerOptions.forEach((option) => {
      option.addEventListener('click', () => {
        if (isNavigating) return;

        isNavigating = true;
        recordQuizAnswer(1, option.dataset.choice);
        option.classList.add('is-selected');
        answerOptions.forEach((item) => {
          item.disabled = true;
        });

        window.setTimeout(() => {
          pageFrame.classList.add('is-dissolving');
          window.setTimeout(() => {
            window.location.href = 'quiz2.html';
          }, 1000);
        }, 1000);
      });
    });
  </script>
</body>
</html>
